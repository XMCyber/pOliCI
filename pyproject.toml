[project]
name = "polci"
version = "0.1.0"
description = "OCI policy statement parser (ANTLR-based)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime>=4.13.0,<4.14",
    "click>=8.1.0",
    "oci",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "flask>=3.0.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "antlr4-tools>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules", "grammar"]
